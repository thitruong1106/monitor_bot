name: TCG Stock Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stock-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          WEBHOOKS_JSON: ${{ secrets.WEBHOOKS_JSON }}
        run: python watcher.py

      - name: Commit updated state
        run: |
          git config user.name  "tcg-watcher-bot"
          git config user.email "tcg-watcher-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged — nothing to commit"
          else
            git commit -m "Update state [skip ci]"
            git push
          fi
